homeassistant:
  name: Day Mode DevContainer
  latitude: 48.8566
  longitude: 2.3522
  elevation: 0
  unit_system: metric
  country: FR
  time_zone: Europe/Paris

# Charger la config par défaut SAUF conversation
default_config:

# Désactiver explicitement conversation
conversation: null

# Enable development mode
logger:
  default: info
  logs:
    homeassistant.components.lovelace: debug

# User interface
# Resources are registered via .storage/lovelace_resources (storage mode ignores configuration.yaml resources)
lovelace:
  mode: storage

# Test entities simulating the HomeShift integration entities.
# The template selects expose select.homeshift_day_mode and select.homeshift_thermostat_mode
# (same domain as the real integration), backed by input_select helpers for state storage.
input_select:
  homeshift_day_mode_backing:
    name: HomeShift Day Mode (backing)
    options:
      - Maison
      - Travail
      - Télétravail
      - Absence
  homeshift_thermostat_mode_backing:
    name: HomeShift Thermostat Mode (backing)
    options:
      - Eteint
      - Chauffage
      - Climatisation
      - Ventilation

template:
  - select:
      - name: "homeshift_day_mode"
        unique_id: homeshift_day_mode
        state: "{{ states('input_select.homeshift_day_mode_backing') }}"
        options: "{{ state_attr('input_select.homeshift_day_mode_backing', 'options') }}"
        attributes:
          option_map: "{{ {'home': 'Maison', 'work': 'Travail', 'remote': 'Télétravail', 'away': 'Absence'} }}"
          option_keys: "{{ {'home': 'Maison', 'work': 'Travail', 'remote': 'Télétravail', 'away': 'Absence'}.keys() | list }}"
          current_key: "{{ {'Maison': 'home', 'Travail': 'work', 'Télétravail': 'remote', 'Absence': 'away'}.get(states('input_select.homeshift_day_mode_backing')) }}"
        select_option:
          service: input_select.select_option
          data:
            entity_id: input_select.homeshift_day_mode_backing
            option: "{{ option }}"
      - name: "homeshift_thermostat_mode"
        unique_id: homeshift_thermostat_mode
        state: "{{ states('input_select.homeshift_thermostat_mode_backing') }}"
        options: "{{ state_attr('input_select.homeshift_thermostat_mode_backing', 'options') }}"
        attributes:
          option_map: "{{ {'off': 'Eteint', 'heating': 'Chauffage', 'cooling': 'Climatisation', 'ventilation': 'Ventilation'} }}"
          option_keys: "{{ {'off': 'Eteint', 'heating': 'Chauffage', 'cooling': 'Climatisation', 'ventilation': 'Ventilation'}.keys() | list }}"
          current_key: "{{ {'Eteint': 'off', 'Chauffage': 'heating', 'Climatisation': 'cooling', 'Ventilation': 'ventilation'}.get(states('input_select.homeshift_thermostat_mode_backing')) }}"
        select_option:
          service: input_select.select_option
          data:
            entity_id: input_select.homeshift_thermostat_mode_backing
            option: "{{ option }}"
  - number:
      - name: "homeshift_override_duration"
        unique_id: homeshift_override_duration
        state: "{{ states('input_number.homeshift_override_duration_backing') | float(0) }}"
        min: 0
        max: 720
        step: 5
        unit_of_measurement: min
        icon: mdi:timer-outline
        set_value:
          service: input_number.set_value
          data:
            entity_id: input_number.homeshift_override_duration_backing
            value: "{{ value }}"
      - name: "homeshift_early_switch"
        unique_id: homeshift_early_switch
        state: "{{ states('input_number.homeshift_early_switch_backing') | float(0) }}"
        min: 0
        max: 480
        step: 5
        unit_of_measurement: min
        icon: mdi:clock-fast
        set_value:
          service: input_number.set_value
          data:
            entity_id: input_number.homeshift_early_switch_backing
            value: "{{ value }}"
  - sensor:
      - name: "homeshift_next_scan"
        unique_id: homeshift_next_scan
        state: "{{ (now() + timedelta(minutes=47)).isoformat() }}"
        device_class: timestamp
      - name: "homeshift_next_mode"
        unique_id: homeshift_next_mode
        state: "{{ states('input_text.homeshift_next_mode_backing') }}"
      - name: "homeshift_next_mode_at"
        unique_id: homeshift_next_mode_at
        state: "{{ (now() + timedelta(hours=2, minutes=15)).isoformat() }}"
        device_class: timestamp
      - name: "homeshift_cover_open_time"
        unique_id: homeshift_cover_open_time
        state: "{{ states('input_text.homeshift_cover_open_time_backing') }}"
        icon: mdi:roller-shade
      - name: "homeshift_cover_close_time"
        unique_id: homeshift_cover_close_time
        state: "{{ states('input_text.homeshift_cover_close_time_backing') }}"
        icon: mdi:roller-shade-closed
  - binary_sensor:
      - name: "homeshift_cover_heat_active"
        unique_id: homeshift_cover_heat_active
        state: "{{ states('input_boolean.homeshift_heat_protection_backing') == 'on' }}"
        device_class: heat
      # Simulates binary_sensor.homeshift_covers_left_open: each simulated open
      # window puts its cover in the list, with the same attributes the
      # integration publishes (count, covers, window_sensors, checked_on).
      - name: "homeshift_covers_left_open"
        unique_id: homeshift_covers_left_open
        device_class: problem
        icon: mdi:window-shutter-alert
        state: >-
          {{ is_state('input_boolean.homeshift_window_chambre_backing', 'on')
             or is_state('input_boolean.homeshift_window_salon_backing', 'on') }}
        attributes:
          covers: >-
            {%- set ns = namespace(covers=[]) -%}
            {%- for cover, window in [
                  ['cover.volet_chambre', 'input_boolean.homeshift_window_chambre_backing'],
                  ['cover.volet_salon', 'input_boolean.homeshift_window_salon_backing'],
                ] if is_state(window, 'on') -%}
              {%- set ns.covers = ns.covers + [cover] -%}
            {%- endfor -%}
            {{ ns.covers }}
          window_sensors: >-
            {%- set ns = namespace(map={}) -%}
            {%- for cover, window in [
                  ['cover.volet_chambre', 'input_boolean.homeshift_window_chambre_backing'],
                  ['cover.volet_salon', 'input_boolean.homeshift_window_salon_backing'],
                ] if is_state(window, 'on') -%}
              {%- set ns.map = dict(ns.map, **{cover: window}) -%}
            {%- endfor -%}
            {{ ns.map }}
          count: >-
            {{ [is_state('input_boolean.homeshift_window_chambre_backing', 'on'),
                is_state('input_boolean.homeshift_window_salon_backing', 'on')]
               | select | list | count }}
          checked_on: "{{ now().date().isoformat() }}"

# Simulates number.homeshift_override_duration and number.homeshift_early_switch
# from the HomeShift integration.
input_number:
  homeshift_override_duration_backing:
    name: HomeShift Override Duration (backing)
    min: 0
    max: 720
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-outline
  homeshift_early_switch_backing:
    name: HomeShift Early Switch (backing)
    min: 0
    max: 480
    step: 5
    unit_of_measurement: min
    icon: mdi:clock-fast

# Simulates sensor.homeshift_next_mode (text) from the HomeShift integration.
input_text:
  homeshift_next_mode_backing:
    name: HomeShift Next Mode (backing)
    initial: "Télétravail"
  homeshift_cover_open_time_backing:
    name: HomeShift Cover Open Time (backing)
    initial: "08:30"
    icon: mdi:roller-shade
  homeshift_cover_close_time_backing:
    name: HomeShift Cover Close Time (backing)
    initial: "21:15"
    icon: mdi:roller-shade-closed

# Scheduler integration
# NOTE: The scheduler integration must be added via the Home Assistant UI first!
# Steps to add:
#   1. Go to Settings → Devices & Services
#   2. Click "+ Add Integration"
#   3. Search for "Scheduler" and add it
#
# After adding the integration, you can customize it by uncommenting and editing below:
# scheduler:
#   customize:
#     light:
#       icon: mdi:lightbulb
#     switch:
#       icon: mdi:power-plug

# Test entities for scheduler
input_boolean:
  test_switch:
    name: Test Switch
    icon: mdi:power-plug
  test_light:
    name: Test Light
    icon: mdi:lightbulb
  homeshift_heat_protection_backing:
    name: HomeShift Heat Protection (backing)
    icon: mdi:fire-alert
  homeshift_cover_state_backing:
    name: HomeShift Cover State (backing)
    icon: mdi:window-shutter
  # Simulated window sensors: switch one on and its cover shows up in
  # binary_sensor.homeshift_covers_left_open, as if tonight's close skipped it.
  homeshift_window_chambre_backing:
    name: Fenêtre chambre ouverte (simulation)
    icon: mdi:window-open-variant
  homeshift_window_salon_backing:
    name: Fenêtre salon ouverte (simulation)
    icon: mdi:window-open-variant

# Test cover entity simulating the HomeShift daily cover group
# (select.cover_entity in the card triggers cover.open_cover/close_cover on this entity).
cover:
  - platform: template
    covers:
      homeshift_daily_covers:
        friendly_name: "HomeShift Daily Covers"
        device_class: shutter
        value_template: "{{ 'open' if is_state('input_boolean.homeshift_cover_state_backing', 'on') else 'closed' }}"
        open_cover:
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.homeshift_cover_state_backing
        close_cover:
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.homeshift_cover_state_backing
      # The covers the simulated windows belong to. They exist only so the
      # card can resolve their friendly names; up while their window is open.
      volet_chambre:
        friendly_name: "Volet chambre"
        device_class: shutter
        value_template: "{{ 'open' if is_state('input_boolean.homeshift_window_chambre_backing', 'on') else 'closed' }}"
        open_cover:
          - delay: 0
        close_cover:
          - delay: 0
      volet_salon:
        friendly_name: "Volet salon"
        device_class: shutter
        value_template: "{{ 'open' if is_state('input_boolean.homeshift_window_salon_backing', 'on') else 'closed' }}"
        open_cover:
          - delay: 0
        close_cover:
          - delay: 0
