title: HomeShift Dashboard
# NOTE: Ce fichier est une référence documentaire uniquement.
# En mode "storage", Home Assistant utilise .storage/lovelace comme configuration active.
# Pour modifier le tableau de bord, utiliser l'éditeur HA ou éditer .storage/lovelace directement.
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      - type: custom:homeshift-card
        name: Thermostat
        day_mode_entity: select.homeshift_day_mode
        thermostat_mode_entity: select.homeshift_thermostat_mode
        override_duration_entity: number.homeshift_override_duration
        early_switch_entity: number.homeshift_early_switch
        next_mode_entity: sensor.homeshift_next_mode
        next_mode_at_entity: sensor.homeshift_next_mode_at
        heat_protection_entity: binary_sensor.homeshift_cover_heat_active
        cover_open_time_entity: sensor.homeshift_cover_open_time
        cover_close_time_entity: sensor.homeshift_cover_close_time
        open_covers_entity: button.homeshift_open_covers
        close_covers_entity: button.homeshift_close_covers
        covers_left_open_entity: binary_sensor.homeshift_covers_left_open

      - type: entities
        title: Entités HomeShift
        entities:
          - entity: select.homeshift_day_mode
          - entity: select.homeshift_thermostat_mode
          - entity: number.homeshift_override_duration
          - entity: number.homeshift_early_switch
          - entity: sensor.homeshift_next_mode
          - entity: sensor.homeshift_next_mode_at
          - entity: binary_sensor.homeshift_cover_heat_active
          - entity: input_boolean.homeshift_window_chambre_backing
          - entity: input_boolean.homeshift_window_salon_backing
          - entity: binary_sensor.homeshift_covers_left_open

  - title: Scheduler
    path: scheduler
    icon: mdi:calendar-clock
    cards:
      - type: custom:scheduler-card
        title: Schedules

      - type: entities
        title: Test Entities
        entities:
          - entity: input_boolean.test_switch
          - entity: input_boolean.test_light
